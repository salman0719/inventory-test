name: ci

on: [push]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        ports: ["5432:5432"]
        env: { POSTGRES_DB: app, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
    env:
      PORT: 3000
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      # The request middleware builds a Supabase client on every route and throws
      # when these are empty, which 500s the app before the local auth shim can
      # answer. CI has no hosted project, so they only have to be well-formed:
      # no request carries a session cookie here, so nothing is verified against
      # the dummy origin and every visitor is signed out.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # Fails when nothing is applied, so an empty or stale migrations folder
      # cannot pass CI again.
      - run: npm run db:migrate:ci
      # The request path connects as `app_user`, and the label tests call it, so
      # the role has to exist here. Minting it after the migrations is required:
      # the script grants it membership in `authenticated`, which they create.
      # Export the generated URL instead of reusing DATABASE_URL: this is the only
      # check that logs in as the role the app deploys with. RLS itself is still
      # enforced under the owner URL (withTenant issues SET LOCAL ROLE
      # authenticated), but its password login, non-bypassrls attributes and
      # membership would then never be exercised.
      - name: create app role for the request path
        run: |
          npm run db:app-role:local
          grep '^DATABASE_URL_APP=' .env.local >> "$GITHUB_ENV"
      # Twice: the seed must be idempotent.
      - run: npm run db:seed && npm run db:seed
      - run: npm run test:run
      # Real Postgres, real migrations: cross-tenant reads and ledger write
      # protection are proved here, not by hand.
      - run: npm run test:db
      - run: npm run build
      - run: npm run perf:budget
      - run: npx playwright install --with-deps chromium
      # Server and its consumers share one step: a background process from a
      # previous step is not guaranteed to still be running here.
      - name: smoke + e2e against a started server
        run: |
          npm run start > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "$APP_URL/" > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS "$APP_URL/" > /dev/null 2>&1; then
            echo "server did not become ready; app log follows"
            cat "$RUNNER_TEMP/app.log"
            exit 1
          fi
          npm run smoke
          npm run test:e2e
